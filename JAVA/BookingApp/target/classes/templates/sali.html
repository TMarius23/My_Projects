<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Lista Săli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("https://www.evosign.ro/wp-content/uploads/2023/01/design-interior-sali-evenimente-Paradis-Ramnicu-Valcea-img-princ-800x600.jpg") no-repeat center center fixed;
            background-size: cover;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .table-container {
            margin: 50px auto;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.92);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.25);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="table-container">
        <h2>Lista Sălilor</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nume</th>
                <th>Descriere</th>
                <th>Tip</th>
                <th>Preț (RON)</th>
                <th>Nr. Închirieri</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <!-- Thymeleaf va popula automat -->
            <tr th:each="sala : ${sali}">
                <td th:text="${sala.idSala}"></td>
                <td th:text="${sala.name}"></td>
                <td th:text="${sala.description}"></td>
                <td th:text="${sala.tipSala}"></td>
                <td th:text="${sala.price}"></td>
                <td th:text="${sala.nrDeInchirieri}"></td>
                <td>
                    <span th:text="${sala.inchiriata} ? 'Închiriată' : 'Disponibilă'"></span>
                </td>

                <td>
                    <form th:action="@{/stergeSala/{id}(id=${sala.idSala})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Ești sigur că vrei să ștergi această sală?');">
                            Șterge
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>
        <div class="text-center">
            <a href="/adaugareSala" class="btn btn-primary">Adaugă Sală Nouă</a>
        </div>
    </div>
</div>
</body>
</html>
