<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contul Meu – Magic Style Events</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .header {
            background: linear-gradient(90deg, #1abc9c, #16a085);
            color: white;
            text-align: center;
            padding: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        .nav-menu {
            background-color: #3498db;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-menu a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .account-info p,
        .settings input {
            font-size: 16px;
            margin: 8px 0;
        }

        .settings input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .settings button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            background-color: #1abc9c;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        canvas {
            max-width: 100%;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="header">Magic Style Events</div>

<div class="nav-menu">
    <a href="indexUser">Acasă</a>
    <a href="contactUser">Contact</a>
    <a href="about">Despre noi</a>
</div>

<div class="container">
    <div class="section account-info">
        <h2>Detalii cont</h2>

        <form th:action="@{/updateUser}" th:object="${user}" method="POST">
            <p>
                <strong>Nume</strong>
                <span th:text="${user.name}"></span>
            </p>

            <p>
                <strong>Email</strong>
                <span th:text="${user.email}"></span>
            </p>

            <p>
                <strong>Rol</strong>
                Utilizator
            </p>
        </form>
    </div>

    <div class="section settings">
        <h2>Setări cont</h2>

        <form th:action="@{/updateUserPassword}" th:object="${user}" method="POST">
            <label for="password">Schimbă parola</label>
            <input th:field="*{id}" type="hidden"/>
            <input type="password" id="password" th:field="*{password}" placeholder="Parolă nouă"/>
            <button type="submit">Salvează</button>
        </form>
    </div>

    <div class="section stats">
        <h2>Statistici</h2>
        <form th:action="@{/updateUser}" th:object="${user}" method="POST">
            <div class="summary-box">
                Număr total de săli inchiriate: <span th:text="${user.nr_sali_inchiriate}"></span>
            </div>
        </form>
    </div>
</div>

<div class="footer">&copy; 2025 Magic Style Events</div>

</body>
</html>
