<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact – Magic Style Events</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .header {
            background: linear-gradient(90deg, #1abc9c, #16a085);
            color: white;
            text-align: center;
            padding: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        .nav-menu {
            background-color: #3498db;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-menu a:hover {
            text-decoration: underline;
        }

        .contact-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .contact-info{
            flex: 1 1 400px;
        }

        .contact-info h2,
        .contact-form h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .contact-info p {
            margin: 10px 0;
            font-size: 16px;
        }

        .contact-info p strong {
            display: inline-block;
            width: 100px;
        }

        .contact-form form {
            display: flex;
            flex-direction: column;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .contact-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .contact-form button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .contact-form button:hover {
            background-color: #16a085;
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="header">Magic Style Events</div>

<div class="nav-menu">
    <a href="indexUser">Acasă</a>
    <a href="about">Despre noi</a>
    <a href="contulMeuUser">Contul meu</a>
</div>

<div class="contact-container">
    <div class="contact-info">
        <h2>Informații de contact</h2>
        <p><strong>Email:</strong> contact@magicstyleevents.ro</p>
        <p><strong>Telefon:</strong> +40 721 123 456</p>
        <p><strong>Adresă:</strong> Str. Fericirii 21, București</p>
        <p><strong>Program:</strong> Luni – Vineri, 09:00 – 17:00</p>
    </div>
</div>

<div class="footer">
    &copy; 2025 Magic Style Events. Toate drepturile rezervate.
</div>


</body>
</html>
