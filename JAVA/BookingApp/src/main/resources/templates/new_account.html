<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Booking Event Hall</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('imagini/SalaEvenimente.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #3498db;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s ease-in-out;
        }

        input[type="text"]:hover, input[type="password"]:hover, input[type="email"]:hover {
            border-color: #1abc9c;
        }

        .radio-container {
            text-align: left;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }

        .radio-container input {
            width: auto;
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1abc9c;
        }

        .login form {
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none;
        }

    </style>

</head>
<body>

<div class="login">
    <h1>Cont nou</h1>
    <form method="post" th:action="@{/adaugaUser}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="email" name="email" placeholder="Email" required>


        <div class="radio-container">
            <label>
                <input type="radio" name="account_type" value="user" id="personalRadio" checked>
                Cont personal
            </label>
            <label>
                <input type="radio" name="account_type" value="admin" id="businessRadio">
                Cont business
            </label>
        </div>

        <div id="personalSection" class="hidden">
        </div>

        <div id="businessSection" class="hidden">
            <p>Vă rugăm să completați detalii suplimentare pentru contul business.</p>
            <input type="text" name="business_field" placeholder="Camp business">
        </div>

        <button type="submit">Creeaza cont</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const personalRadio = document.getElementById('personalRadio');
        const businessRadio = document.getElementById('businessRadio');

        personalRadio.addEventListener('change', function () {
            document.getElementById('personalSection').classList.remove('hidden');
            document.getElementById('businessSection').classList.add('hidden');
        });

        businessRadio.addEventListener('change', function () {
            document.getElementById('businessSection').classList.remove('hidden');
            document.getElementById('personalSection').classList.add('hidden');
        });
    });
</script>


</body>
</html>
